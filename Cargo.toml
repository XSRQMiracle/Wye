[workspace]
resolver = "2"
members = ["crates/wye-platform", "crates/wye-core", "crates/wye-mac", "crates/wye-win", "crates/wye-cli"]
exclude = ["experiments"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/XSRQMiracle/Wye"

[workspace.dependencies]
wye-platform = { path = "crates/wye-platform" }
wye-core = { path = "crates/wye-core" }
wye-mac = { path = "crates/wye-mac" }
wye-win = { path = "crates/wye-win" }
rtrb = "0.4.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
realfft = "3.5.1"
# Only the asynchronous (variable-ratio) sinc resampler is used; no FFT resampler.
rubato = { version = "5.1.0", default-features = false }
# Buffer adapter traits; must be the version rubato itself depends on.
audioadapter = "5.0.0"
# Test-only: count allocator calls in real-time code (warn mode, debug and release tests).
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }

# The resampler is hot inner-loop code: keep debug builds (and tests) usable in real time.
[profile.dev.package.rubato]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
